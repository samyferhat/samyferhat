<svg xmlns="http://www.w3.org/2000/svg" width="900" height="10" viewBox="0 0 900 10" role="img" aria-label="">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff00ff"/>
      <stop offset=".5" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" fill="url(#g)" opacity=".85"/>
  <rect x="-160" y="3" width="160" height="4" rx="2" fill="url(#h)">
    <animate attributeName="x" from="-160" to="900" dur="2.6s" repeatCount="indefinite"/>
  </rect>
