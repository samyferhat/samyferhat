# Génère metrics.terminal.svg et metrics.languages.svg avec lowlighter/metrics
# Prérequis : un secret METRICS_TOKEN (PAT classic, scope "repo" pour inclure les repos privés)
name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 3h UTC
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Carte 1 : session SSH — profil, activité, communauté, repos, lignes de code
      - name: Terminal overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: terminal
          filename: metrics.terminal.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

      # Carte 2 : langages (analyse réelle des commits, repos privés inclus) + calendrier isométrique
      - name: Languages & calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: terminal
          filename: metrics.languages.svg
          base: ""
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 90
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
