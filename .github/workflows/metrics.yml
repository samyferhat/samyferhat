# Génère TOUS les SVG utilisés par les thèmes de themes/ (voir THEMES.md) avec lowlighter/metrics.
# Un seul run produit l'ensemble des fichiers : changer de thème (make <theme>) ne demande aucun rerun.
# Prérequis : un secret METRICS_TOKEN (PAT classic, scope "repo" pour inclure les repos privés).
#
#   thème      fichier(s) généré(s) sur main
#   terminal   metrics.terminal.svg, metrics.languages.svg
#   neon       metrics.classic-dark.svg
#   minimal    metrics.classic-light.svg
#   fun        metrics.classic-color.svg
name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 3h UTC
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ───────────────────────────── thème terminal ─────────────────────────────
      # Carte 1 : session SSH — profil, activité, communauté, repos, lignes de code
      - name: Terminal overview (metrics.terminal.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: terminal
          filename: metrics.terminal.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
          # Ce repo (collaborateur) contient un contributeur dont le compte GitHub a été supprimé
          # (author null) : le plugin lines plante dessus ("Cannot read properties of null (reading 'login')").
          plugin_lines_skipped: RomainCabaret/mindstep-back

      # Carte 2 : langages les plus utilisés + calendrier isométrique
      # (indepth désactivé : l'analyse des commits ne remontait qu'un seul langage à 100 %)
      - name: Terminal languages & calendar (metrics.languages.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: terminal
          filename: metrics.languages.svg
          base: ""
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ─────────────────────────────── thème neon ───────────────────────────────
      # Classic : palette magenta/cyan sur les langages, calendrier isométrique sur un an,
      # suivi des issues/PR, followers.
      - name: Classic dark for neon theme (metrics.classic-dark.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: classic
          filename: metrics.classic-dark.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell
          plugin_languages_colors: "0:#ff00ff, 1:#00ffff, 2:#ff2bd6, 3:#00d4ff, 4:#b026ff, 5:#39ff14"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 21
          plugin_people_size: 24
      # ────────────────────────────── thème minimal ─────────────────────────────
      # Classic en largeur "large", sobre : peu de plugins, pas d'animations.
      - name: Classic light for minimal theme (metrics.classic-light.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: classic
          filename: metrics.classic-light.svg
          base: header, activity, community
          config_display: large
          config_animations: no
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # ──────────────────────────────── thème fun ───────────────────────────────
      # Classic coloré : langages en arc-en-ciel, calendriers, suivi des issues/PR,
      # followers et following, derniers repos étoilés.
      - name: Classic color for fun theme (metrics.classic-color.svg)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: samyferhat
          template: classic
          filename: metrics.classic-color.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell
          plugin_languages_colors: rainbow
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
          plugin_people_size: 28
          plugin_stars: yes
          plugin_stars_limit: 3
      
      # Plugins volontairement absents, cassés avec lowlighter/metrics@latest (vérifié le 2026-10-02) :
      #   - habits et activity : l'API Events de GitHub ne renvoie plus payload.commits sur les PushEvent,
      #     les deux plugins plantent dessus ("Cannot destructure property 'author'" / "reading 'filter'").
      #   - achievements : interroge les Projects (classic), supprimés par GitHub (GraphqlResponseError).
